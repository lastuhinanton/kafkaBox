---

etc_hosts_path: '/etc/hosts'

#############################################
# kafka *********************************** #
#############################################

kafka:
  broker_id: "{{ inventory_hostname | regex_replace('node', '') }}"
  memory: '700M'
  swap: '700M'
  ports:
    sasl:
      outside: '9092'
      inside: '9092'
    monitoring:
      outside: '9093'
      inside: '9093'
  systemd_service:
    name: "kafka.service"
    path: "/etc/systemd/system"
  jaas_config:
    name: 'jaas_kafka_config.conf'
    path: '/etc/kafka'
  log_path: '/var/lib/kafka/data'
  listeners: 'SASL_PLAINTEXT://:9092,PLAINTEXT://:9093'
  advertised_listeners: 'SASL_PLAINTEXT://{{ inventory_hostname }}:9092,PLAINTEXT://{{ inventory_hostname }}:9093' # Узнать подробнее про это поле
  zookeeper_connect: '{{ inventory_hostname }}:2181'
  docker:
    container_name: 'kafka'
    image:
      path: "confluentinc/cp-kafka"
      version: "5.3.1"
    network_mode: 'host'

delay_between_nodes: 3
  

#############################################
# kafka-exporter ************************** #
#############################################

kafka_exp:
  docker:
    container_name: 'kafka_exporter'
    image:
      path: 'danielqsj/kafka-exporter'
      version: 'v1.9.0'
    network_mode: 'host'
  ports:
    plain:
      outside: '9308'
      inside: '9308'