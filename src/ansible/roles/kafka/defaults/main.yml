---

etc_hosts_path: '/etc/hosts'

#############################################
# kafka *********************************** #
#############################################

kafka:
  broker_id: "{{ inventory_hostname | regex_replace('node', '') }}"
  memory: '700M'
  swap: '700M'
  ports:
    plaintext:
      advertised:
        outside: '9092'
        inside: '9092'
  systemd_service:
    name: "kafka.service"
    path: "/etc/systemd/system"
  log_path: '/var/lib/kafka/data'
  listeners: 'PLAINTEXT://:9092'
  advertised_listeners: 'PLAINTEXT://{{ inventory_hostname }}:9092' # Узнать подробнее про это поле
  zookeeper_connect: '{{ inventory_hostname }}:2181'
  docker:
    container_name: 'kafka'
    image:
      path: "confluentinc/cp-kafka"
      version: "5.3.1"
    network_mode: 'host'

delay_between_nodes: 3
  

#############################################
# kafka-exporter ************************** #
#############################################

kafka_exp:
  docker:
    container_name: 'kafka_exporter'
    image:
      path: 'danielqsj/kafka-exporter'
      version: 'v1.9.0'
    network_mode: 'host'
  ports:
    plain:
      outside: '9308'
      inside: '9308'
  commands:
    server: '{{ inventory_hostname }}:9092'