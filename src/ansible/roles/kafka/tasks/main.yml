---
- name: "Add variables"
  include_vars:
   file: "{{ playbook_dir }}/roles/kafka/defaults/kafka.service.yml"

- name: "Create directories"
  file:
    path: "{{ item }}"
    state: directory
    mode: "0777"
  loop:
    - "{{ kafka_log_path }}"

- name: "Backup files if those will be changed"
  include_tasks:
    file: backup_and_push.yml
  loop:
    - name: "{{ kafka_service }}"
      path: "{{ kafka_service_path }}"

- name: "Restarted a {{ kafka_service }}"
  systemd_service:
    state: restarted
    daemon_reload: true
    name: "{{ kafka_service }}"

- name: "Wait {{ delay_between_nodes}} between nodes"
  pause:
    seconds: "{{ delay_between_nodes }}"

