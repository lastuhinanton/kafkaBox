---
- name: "Add variables"
  include_vars:
    file: "{{ playbook_dir }}/roles/zookeeper/defaults/zookeeper.service.yml"

- name: "Recursively change permissions of a directory"
  file:
    path: "{{ item }}"
    state: directory
    recurse: yes
    mode: "0777"
  loop:
    - "{{ data_dir }}"
    - "{{ conf_dir }}"

- name: "Backup the {{ filename }} if it will be changed"
  include_tasks:
    file: backup_and_push.yml

- name: "Restarted a {{ filename }}"
  systemd_service:
    state: restarted
    daemon_reload: true
    name: "{{ filename }}"

