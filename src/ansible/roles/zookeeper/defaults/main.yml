
etc_hosts_path: '/etc/host'

#############################################
# zookeeper ******************************* #
#############################################

zk_name: 'zookeeper'

zk_client_port: '2181'

zk_service: 'zookeeper.service'
zk_service_path: '/etc/systemd/system'

zk_jaas_conf: 'zookeeper_jaas.conf'

zk_data_dir: '/zookeeper-data'
zk_log_dir: '/zookeeper-log'

delay_between_nodes: 3

zk_memmory: '1024M'
zk_swap: '1024M'

docker:
  image:
    name: 'confluentinc/cp-zookeeper'
    tag: '5.3.1'
  ports:
    zk_inside_port: '2181'
    zk_outside_port: '2181'
  network_mode: 'host'

zk_servers:
  one: "node1"
  two: "node2"
  three: "node3"

a: '-Djava.security.auth.login.config={{ zk_data_dir }}/zookeeper_jaas.conf'
b: '-Dzookeeper.DigestAuthenticationProvider.superDigest={{ zk_data_dir }}/secrets'
c: '-Dquorum.auth.enableSasl=true'
d: '-Dquorum.auth.learnerRequireSasl=true'
e: '-Dquorum.auth.serverRequireSasl=true'
f: '-Dquorum.cnxn.threads.size=20'
g: '-DjaasLoginRenew=3600000'
h: '-DrequireClientAuthScheme=sasl'
m: '-Dquorum.auth.learner.loginContext=QuorumLearner'
n: '-Dquorum.auth.server.loginContext=QuorumServer'

#############################################
# zookeeper-exporter ********************** #
#############################################

zk_exp_name: 'zookeeper-exporter'
zk_exp_image: 'dabealu/zookeeper-exporter'
zk_exp_image_tag: 'latest'

zk_exp_inside_port: '9141'
zk_exp_outside_port: '9141'



